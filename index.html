<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Mon Portfolio - JOJ Ops Hub</title>
    <style>
        .project-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
        }

        .tech {
            background: #e0e0e0;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-right: 5px;
        }
    </style>
</head>

<body>
    <h1>Mes Réalisations</h1>
    <div id="projects-container">Chargement des projets...</div>

    <script>
        async function loadProjects() {
            try {
                const response = await fetch('http://localhost:5000/api/projects');
                const projects = await response.json();

                const container = document.getElementById('projects-container');
                container.innerHTML = projects.map(p => `
                    <div class="project-card">
                        <h3>${p.title}</h3>
                        <p>${p.description}</p>
                        <div>${p.technologies.map(t => `<span class="tech">${t}</span>`).join('')}</div>
                        <a href="${p.githubLink}" target="_blank">Voir sur GitHub</a>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Erreur:", err);
            }
        }
        loadProjects();
    </script>
</body>

</html>
